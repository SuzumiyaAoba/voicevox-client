version: 2

updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      biome:
        patterns: ["@biomejs/*"]
    reviewers:
      - "suzumiyaaoba"
    assignees:
      - "suzumiyaaoba"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    # セキュリティアップデートを優先
    allow:
      - dependency-type: "all"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - "suzumiyaaoba"
    assignees:
      - "suzumiyaaoba"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker (もしDockerfileがある場合)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "suzumiyaaoba"
    assignees:
      - "suzumiyaaoba"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
