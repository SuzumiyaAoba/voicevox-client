name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0, v0.1.0 etc.
      - 'v*.*.*-*'  # v1.0.0-alpha.1, v1.0.0-beta.1 etc.

permissions:
  contents: read

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    permissions:
      contents: write
      id-token: write
    environment: release # 保護された環境を使用

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Corepack
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable --check-cache

      - name: Generate API types
        run: corepack yarn generate

      - name: Run security audit
        run: corepack yarn npm audit -A --recursive --severity moderate

      - name: Run all tests
        run: corepack yarn test:run

      - name: Run linter
        run: corepack yarn check

      - name: Build package
        run: corepack yarn build:dual

      - name: Verify package contents
        run: |
          corepack yarn pack --dry-run
          ls -la dist/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version to publish: $VERSION"

      - name: Get current UTC timestamp
        id: timestamp
        run: |
          UTC_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "utc_time=$UTC_TIME" >> $GITHUB_OUTPUT
          echo "Current UTC time: $UTC_TIME"

      - name: Get previous tag for changelog
        id: previous_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Update package version (skip if unchanged)
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package.json version: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" = "$TAG_VERSION" ]; then
            echo "Version unchanged. Skipping yarn version."
          else
            corepack yarn version "$TAG_VERSION" --immediate
            echo "Updated package.json version to $TAG_VERSION"
          fi

      - name: Publish to NPM with provenance
        run: |
          echo "Publishing package with provenance..."
          corepack yarn npm publish --provenance --access public
          echo "✅ Package successfully published to npm!"
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Release v${{ steps.version.outputs.version }}

            ### 📦 Installation

            ```bash
            yarn add @suzumiyaaoba/voicevox-client@${{ steps.version.outputs.version }}
            ```

            ### 📋 Package Information

            - **Package**: [@suzumiyaaoba/voicevox-client](https://www.npmjs.com/package/@suzumiyaaoba/voicevox-client)
            - **Version**: ${{ steps.version.outputs.version }}
            - **Published**: ${{ steps.timestamp.outputs.utc_time }}
            - **Node.js Support**: ^22.22.2 || ^24.15.0 || >=26.0.0

            ### 🔒 Security & Verification

            This package was published with npm provenance for enhanced security:

            ```bash
            # Verify package signatures
            npm audit signatures

            # View package information
            npm view @suzumiyaaoba/voicevox-client@${{ steps.version.outputs.version }}
            ```

            ### 📖 Documentation

            - [README](https://github.com/${{ github.repository }}#readme)
            - [API Documentation](https://github.com/${{ github.repository }}/tree/master/api-schema)
            - [Examples](https://github.com/${{ github.repository }}#使用方法)

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.previous_tag.outputs.previous_tag }}...v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true

  post-release:
    name: Post-release checks
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Checkout release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Corepack
        run: |
          npm install --global --ignore-scripts corepack@0.36.0
          corepack enable

      - name: Wait for package to be available
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Waiting for package @suzumiyaaoba/voicevox-client@$VERSION to be available..."

          # NPM公開後の反映を待つ
          sleep 60

          # パッケージの存在確認
          if corepack yarn npm info @suzumiyaaoba/voicevox-client@$VERSION > /dev/null 2>&1; then
            echo "✅ Package successfully published and available!"
          else
            echo "❌ Package not found on NPM registry"
            exit 1
          fi

      - name: Test installation and imports
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_MANAGER=$(node -p "require('./package.json').packageManager")
          TEST_DIR=$(mktemp -d)
          cp .yarnrc.yml "$TEST_DIR/.yarnrc.yml"
          cd "$TEST_DIR"
          printf '{"private":true,"packageManager":"%s"}\n' "$PACKAGE_MANAGER" > package.json
          # Only this exact, just-published artifact bypasses the release age gate.
          printf '\nnpmPreapprovedPackages:\n  - "@suzumiyaaoba/voicevox-client@%s"\n' "$VERSION" >> .yarnrc.yml
          for attempt in {1..3}; do
            if corepack yarn add --exact "@suzumiyaaoba/voicevox-client@$VERSION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
          node -e "const assert = require('node:assert/strict'); const { client } = require('@suzumiyaaoba/voicevox-client'); assert.equal(typeof client.GET, 'function'); assert.equal(typeof client.POST, 'function');"
          node --input-type=module -e "import { strict as assert } from 'node:assert'; import client from '@suzumiyaaoba/voicevox-client'; assert.equal(typeof client.GET, 'function'); assert.equal(typeof client.POST, 'function');"
          test -f node_modules/@suzumiyaaoba/voicevox-client/dist/index.d.ts
